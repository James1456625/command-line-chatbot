<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聊天机器人</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #2563eb;
        --secondary: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --user: #dbeafe;
        --assistant: #f1f5f9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app {
        max-width: 1100px;
        margin: 24px auto;
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 20px;
        min-height: 80vh;
      }
      .sidebar, .main {
        background: var(--panel);
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .sidebar {
        padding: 18px 14px;
      }
      .sidebar h2 {
        margin: 0 0 16px;
        font-size: 20px;
      }
      .btn {
        border: none;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        background: var(--primary);
        color: white;
        font-size: 14px;
      }
      .btn.secondary {
        background: var(--secondary);
        color: var(--text);
      }
      .panel-actions {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .session-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .session-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 10px 12px;
        background: white;
        cursor: pointer;
        text-align: left;
      }
      .session-item.active {
        border-color: var(--primary);
        background: #eff6ff;
      }
      .session-item small {
        color: var(--muted);
      }
      .main {
        display: flex;
        flex-direction: column;
        min-height: 620px;
      }
      .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 20px;
        border-bottom: 1px solid #e2e8f0;
      }
      .messages {
        flex: 1;
        padding: 18px 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .message {
        max-width: 75%;
        padding: 12px 14px;
        border-radius: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .message.user {
        background: var(--user);
        align-self: flex-end;
      }
      .message.assistant {
        background: var(--assistant);
        align-self: flex-start;
      }
      .composer {
        display: flex;
        gap: 10px;
        padding: 18px 20px;
        border-top: 1px solid #e2e8f0;
      }
      .composer input {
        flex: 1;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 16px;
      }
      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
          margin: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>会话列表</h2>
        <div class="panel-actions">
          <button class="btn" id="newSessionBtn">新建会话</button>
          <button class="btn secondary" id="clearSessionBtn">清空</button>
        </div>
        <ul id="sessionList" class="session-list"></ul>
      </aside>

      <main class="main">
        <div class="chat-header">
          <h2 id="currentSessionTitle">新会话</h2>
        </div>
        <div id="messages" class="messages"></div>
        <div class="composer">
          <input id="userInput" type="text" placeholder="输入消息后按回车发送..." />
          <button class="btn" id="sendBtn">发送</button>
        </div>
      </main>
    </div>

    <script>
      const state = {
        sessions: [],
        currentSessionId: null,
      };

      const sessionListEl = document.getElementById('sessionList');
      const messagesEl = document.getElementById('messages');
      const userInputEl = document.getElementById('userInput');
      const currentSessionTitleEl = document.getElementById('currentSessionTitle');

      function renderSessions() {
        sessionListEl.innerHTML = '';
        state.sessions.forEach((session) => {
          const item = document.createElement('li');
          const button = document.createElement('button');
          button.className = 'session-item' + (session.id === state.currentSessionId ? ' active' : '');
          button.innerHTML = `
            <span>
              <strong>${session.title || '新会话'}</strong><br />
              <small>${new Date(session.updated_at || session.created_at).toLocaleString()}</small>
            </span>
          `;
          button.addEventListener('click', () => selectSession(session.id));
          item.appendChild(button);
          sessionListEl.appendChild(item);
        });
      }

      function renderMessages(messages) {
        messagesEl.innerHTML = '';
        if (!messages.length) {
          messagesEl.innerHTML = '<div class="message assistant">开始新的对话吧。</div>';
          return;
        }
        messages.forEach((msg) => {
          const el = document.createElement('div');
          el.className = `message ${msg.role === 'user' ? 'user' : 'assistant'}`;
          el.textContent = msg.content;
          messagesEl.appendChild(el);
        });
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function fetchSessions() {
        const resp = await fetch('/sessions');
        const sessions = await resp.json();
        state.sessions = sessions;
        if (!state.currentSessionId && sessions.length) {
          selectSession(sessions[sessions.length - 1].id);
        }
        renderSessions();
      }

      async function createSession() {
        const resp = await fetch('/sessions', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ title: `会话 ${state.sessions.length + 1}` }),
        });
        const session = await resp.json();
        state.currentSessionId = session.id;
        await fetchSessions();
        await loadHistory(session.id);
      }

      async function loadHistory(sessionId) {
        const resp = await fetch(`/sessions/${sessionId}/messages`);
        const messages = await resp.json();
        const session = state.sessions.find((item) => item.id === sessionId);
        currentSessionTitleEl.textContent = session ? session.title : '新会话';
        renderMessages(messages);
      }

      async function selectSession(sessionId) {
        state.currentSessionId = sessionId;
        renderSessions();
        await loadHistory(sessionId);
      }

      async function clearCurrentSession() {
        if (!state.currentSessionId) return;
        await fetch(`/sessions/${state.currentSessionId}/clear`, { method: 'POST' });
        await loadHistory(state.currentSessionId);
      }

      async function sendMessage() {
        const message = userInputEl.value.trim();
        if (!message) return;
        if (!state.currentSessionId) {
          await createSession();
        }

        const resp = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: state.currentSessionId, message }),
        });
        const data = await resp.json();
        userInputEl.value = '';
        await fetchSessions();
        renderMessages(data.messages || []);
      }

      document.getElementById('newSessionBtn').addEventListener('click', createSession);
      document.getElementById('clearSessionBtn').addEventListener('click', clearCurrentSession);
      document.getElementById('sendBtn').addEventListener('click', sendMessage);
      userInputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') sendMessage();
      });

      fetchSessions();
    </script>
  </body>
</html>
